name: Telegram Investment Alert

on:
  schedule:
    # Esegue automaticamente ogni giorno alle 07:00, 16:00, 20:00 e 22:00 UTC
    - cron: '0 8,15,19,21 * * *'
  workflow_dispatch: # Permette anche il test manuale da GitHub

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Alert Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_market.py
