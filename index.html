<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Tracker & RSI Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar di controllo -->
  <aside class="w-full md:w-64 bg-slate-800 border-b md:border-b-0 md:border-r border-slate-700 p-6 flex flex-col justify-between shrink-0">
    <div>
      <h1 class="text-xl font-bold text-emerald-400 mb-1">Investment Tracker</h1>
      <p class="text-slate-400 text-xs mb-6">Pannello di controllo e monitoraggio.</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">Sezioni</label>
          <div class="flex flex-row md:flex-col gap-2">
            <button class="flex-1 md:w-full text-left px-3 py-2 rounded text-sm bg-emerald-600 text-white font-medium transition-colors">
              📈 Analisi Tecnica (RSI)
            </button>
            <!-- Spazio riservato per future sezioni dinamiche (es. eToro) -->
          </div>
        </div>
      </div>
    </div>

    <div id="last-update" class="hidden md:block text-xs text-slate-500 border-t border-slate-700 pt-4 mt-6">
      Caricamento dati...
    </div>
  </aside>

  <!-- Contenuto principale -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto">
    <header class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
      <div>
        <h2 class="text-xl md:text-2xl font-bold text-slate-100">Analisi Tecnica & Indicatori</h2>
        <p class="text-slate-400 text-xs md:text-sm mt-1">Monitoraggio in tempo reale dei prezzi di mercato e degli oscillatori RSI.</p>
      </div>
      <div id="last-update-mobile" class="md:hidden text-xs text-slate-500">
        Aggiornamento in corso...
      </div>
    </header>

    <div class="overflow-x-auto bg-slate-800 rounded-lg shadow-xl border border-slate-700">
      <table class="w-full text-left text-xs md:text-sm border-collapse whitespace-nowrap">
        <thead class="bg-slate-700/50 text-slate-300 uppercase text-[10px] md:text-xs border-b border-slate-700">
          <tr>
            <th class="p-3 md:p-4">Asset</th>
            <th class="p-3 md:p-4">Categoria</th>
            <th class="p-3 md:p-4">Prezzo Corrente</th>
            <th class="p-3 md:p-4 text-center">RSI 1h</th>
            <th class="p-3 md:p-4 text-center">RSI 1d</th>
            <th class="p-3 md:p-4 text-center">RSI 1w</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-slate-700">
          <!-- Dinamico -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    function renderRsiBadge(signal) {
      if (!signal) return '<span class="text-slate-500">-</span>';
      const colorClass = signal.rsi >= 75 ? 'bg-rose-950 text-rose-300 border-rose-800' :
                         signal.rsi >= 70 ? 'bg-rose-900/50 text-rose-300 border-rose-700' :
                         signal.rsi <= 25 ? 'bg-emerald-950 text-emerald-300 border-emerald-800' :
                         signal.rsi <= 30 ? 'bg-emerald-900/50 text-emerald-300 border-emerald-700' : 
                         'bg-slate-700 text-slate-300 border-slate-600';
      return `<div class="inline-block px-2 py-1 rounded border text-[11px] ${colorClass}">${signal.rsi} (${signal.status.split(' ')[0]})</div>`;
    }

    async function loadData() {
      try {
        const res = await fetch('./data/history.json?t=' + new Date().getTime());
        const globalData = await res.json();
        
        const updateText = `Aggiornato: ${new Date(globalData.last_updated).toLocaleString('it-IT')}`;
        document.getElementById('last-update').innerText = updateText;
        document.getElementById('last-update-mobile').innerText = updateText;

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        globalData.items.forEach(item => {
          const rsi = item.rsi_signals || {};
          tbody.innerHTML += `
            <tr class="hover:bg-slate-750 transition-colors">
              <td class="p-3 md:p-4 font-medium">${item.name} <span class="text-xs text-slate-400 block md:inline">(${item.ticker})</span></td>
              <td class="p-3 md:p-4"><span class="px-2 py-0.5 bg-slate-700 rounded text-[10px] md:text-xs">${item.category}</span></td>
              <td class="p-3 md:p-4 font-semibold text-slate-200">${item.current_price} ${item.currency}</td>
              <td class="p-3 md:p-4 text-center">${renderRsiBadge(rsi['1h'])}</td>
              <td class="p-3 md:p-4 text-center">${renderRsiBadge(rsi['1d'])}</td>
              <td class="p-3 md:p-4 text-center">${renderRsiBadge(rsi['1wk'])}</td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Errore caricamento:", err);
      }
    }

    loadData();
  </script>
</body>
</html>
